[package]
name = "esrxp-ng-server"
version = "0.3.0"
edition = "2021"
description = "esrxp-ng Rust 后端：FFmpeg 解码 + 硬字幕抓取引擎 + axum HTTP API（TDesign/Electron UI 后端）"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ffmpeg-next = { version = "9.0", default-features = false, features = [
    "codec", "format", "software-scaling", "software-resampling",
    "filter", "device",
] }
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
libc = "0.2"
libloading = "0.8"

[features]
# build+static：从源码编译并静态链接 FFmpeg（Linux/Debian 单二进制零依赖）
# Win 使用动态 BtbN 包随安装包分发，不启用本 feature
vendored-ffmpeg = ["ffmpeg-next/build", "ffmpeg-next/static"]