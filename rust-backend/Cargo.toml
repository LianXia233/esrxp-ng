[package]
name = "esrxp-ng-server"
version = "0.1.0"
edition = "2021"
description = "esrxp-ng Rust 后端：FFmpeg 解码 + 硬字幕抓取引擎 + axum HTTP API（TDesign/Electron UI 后端）"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ffmpeg-next = "4.3.0"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = true
