[package]
name = "esrxp-ng-ui"
version = "0.7.0"
edition = "2021"
description = "esrxp-ng egui 前端（MVP）：打开视频/工程 → 参数 → 预览 → 抓取 → 产物查看/保存。后端以子进程随 GUI 启动，HTTP 127.0.0.1 通信。"

[dependencies]
eframe = "0.31"
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
anyhow = "1"
rfd = "0.15"

[profile.release]
lto = "thin"
