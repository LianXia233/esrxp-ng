[project]
name = "esrxp-ng"
version = "0.1.0"
description = "硬字幕提取工具的现代化重构：FFmpeg(PyAV) 解码 + numpy/OpenCV 向量化像素管线，兼容 Windows 11"
requires-python = ">=3.10"
dependencies = [
    "av>=12",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "typer>=0.9",
]

[project.scripts]
esrxp-ng = "esrxp_ng.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["esrxp_ng"]
